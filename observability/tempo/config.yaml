server:
  http_listen_port: 3200
  grpc_listen_port: 0

distributor:
  receivers:
    otlp:
      protocols:
        http:
        grpc:

ingester:
  max_block_bytes: 1_000_000_000
  max_block_duration: 5m

compactor:
  compaction:
    compaction_window: 1h
    max_block_bytes: 1_000_000_000
    block_retention: 720h   # 30 days

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/metrics

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
